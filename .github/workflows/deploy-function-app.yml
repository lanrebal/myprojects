name: Hourly Trigger Function App Deploy

on:
  push:
    branches:
      - hourly_trigger_functn_app

  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build deployment package
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[deploy:dev]') ||
      contains(github.event.head_commit.message, '[deploy:uat]')

    steps:
      - name: Check out application branch
        uses: actions/checkout@v4
        with:
          ref: hourly_trigger_functn_app

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --target=".python_packages/lib/site-packages" \
            -r requirements.txt

      - name: Create deployment package
        run: |
          zip -r app.zip . \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".vscode/*" \
            --exclude ".venv/*" \
            --exclude ".venv-broken/*" \
            --exclude "__pycache__/*" \
            --exclude "*/__pycache__/*" \
            --exclude "*.pyc" \
            --exclude "*.log" \
            --exclude ".env" \
            --exclude "local.settings.json" \
            --exclude "instructions.txt"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: hourly-trigger-function-app
          path: app.zip
          retention-days: 5

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build

    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[deploy:dev]')

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: hourly-trigger-function-app

      - name: Deploy development Function App
        uses: Azure/functions-action@v1
        with:
          app-name: dev-hourly-trigger-funct-app
          package: app.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_DEV }}

  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: build

    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[deploy:uat]')

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: hourly-trigger-function-app

      - name: Deploy UAT Function App
        uses: Azure/functions-action@v1
        with:
          app-name: uat-hourly-trigger-funct-app
          package: app.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_UAT }}

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_production

    environment: prod-deployment-review

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: hourly-trigger-function-app

      - name: Deploy production Function App
        uses: Azure/functions-action@v1
        with:
          app-name: prd-hourly-trigger-funct-app
          package: app.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_PROD }}